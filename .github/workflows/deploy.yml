name: Deploy

on:
  push:
    branches: [main, claude/sistema-fernando-pwa-1vna5p]
  # Permite publicar sob demanda pela aba Actions.
  workflow_dispatch:

# Só o token mínimo para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build
        # GitHub Pages serve em /<repo>/ — o Vite precisa saber disso para
        # gerar os caminhos de assets, manifest e service worker corretos.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback de SPA para links diretos
        # O Pages é estático e não reescreve rotas: abrir /estudos direto daria
        # 404. Servir o index como página de erro devolve o app, e o router
        # resolve a rota no cliente.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
